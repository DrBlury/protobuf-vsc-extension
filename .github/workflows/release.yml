name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to package, for example v1.2.3'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v1.2.3, optionally with semver prerelease/build metadata."
            echo "Received: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          VSIX_PATH="protobuf-vsc-${VERSION}.vsix"

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "vsix_path=$VSIX_PATH"
          } >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Update package.json version
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm pkg get version
          echo "Updated package metadata to version ${{ steps.version.outputs.version }}"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Run regression fixture checks
        run: npm run test:regressions

      - name: Generate SBOM for Release
        run: |
          npx --no-install cyclonedx-npm --output-file release-sbom.json --output-format json --omit dev

      - name: Run Grype Security Scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          path: '.'
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          output-file: release-grype.sarif

      - name: Upload Release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sbom
          path: release-sbom.json
          retention-days: 90

      - name: Dependency Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Package extension
        run: npm run package -- --out "${{ steps.version.outputs.vsix_path }}"

      - name: Verify packaged extension exists
        run: test -f "${{ steps.version.outputs.vsix_path }}"

      - name: Generate and verify release checksums
        run: |
          sha256sum \
            "${{ steps.version.outputs.vsix_path }}" \
            release-sbom.json \
            > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Changes

          - Updates direct and transitive dependencies to their latest compatible security-patched versions.
          - Keeps high-severity production dependency findings blocking CI and releases.
          - Includes a production CycloneDX software bill of materials and verified SHA-256 checksums alongside the downloadable VSIX.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            ${{ steps.version.outputs.vsix_path }}
            release-sbom.json
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OPEN_VSX_TOKEN is not configured; skipping Open VSX publish."
            exit 0
          fi
          npx --no-install ovsx publish "${{ steps.version.outputs.vsix_path }}"
