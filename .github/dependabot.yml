version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "@types/*"
          - "eslint*"
          - "@typescript-eslint/*"
          - "typescript"
          - "jest"
          - "ts-jest"
      production-dependencies:
        dependency-type: "production"
    ignore:
      # Must not exceed engines.vscode, or vsce refuses to package the extension.
      - dependency-name: "@types/vscode"
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci):"
    labels:
      - "ci"
      - "dependencies"
